<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hello Cloudflare Pages + D1</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.5rem; }
  #list { list-style: none; padding: 0; }
  #list li { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; }
  #list time { color: #888; font-size: 0.8rem; display: block; }
  form { display: flex; gap: 8px; margin: 16px 0; }
  input { flex: 1; padding: 8px; }
  button { padding: 8px 16px; }
  #status { color: #b00; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>Hello World — Cloudflare Pages + Workers + D1</h1>
  <p>This page calls a Pages Function at <code>/api/hello</code>, which reads and writes to a D1 database.</p>

  <form id="form">
    <input id="message" type="text" placeholder="Type a greeting..." required />
    <button type="submit">Add to D1</button>
  </form>
  <p id="status"></p>

  <ul id="list"></ul>

  <script>
    const list = document.getElementById('list');
    const form = document.getElementById('form');
    const input = document.getElementById('message');
    const status = document.getElementById('status');

    async function loadGreetings() {
      status.textContent = 'Loading...';
      try {
        const res = await fetch('/api/hello');
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        list.innerHTML = data.greetings.map(g =>
          `<li>${g.message}<time>${g.created_at} (id: ${g.id})</time></li>`
        ).join('');
        status.textContent = '';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Saving...';
      try {
        const res = await fetch('/api/hello', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: input.value })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        input.value = '';
        await loadGreetings();
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      }
    });

    loadGreetings();
  </script>
</body>
</html>
