name = "mycare-admin"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# D1 binding — replace database_id with the id printed by
# `wrangler d1 create mycarePrototypeRDBMS` (see README.md).
[[d1_databases]]
binding = "DB"
database_name = "mycarePrototypeRDBMS"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
